# Signed release build. Runs only for version tags (v1.7.0) or manually.
#
# Required repository secrets (Settings → Secrets and variables → Actions),
# never committed to the repository:
#   UPLOAD_KEYSTORE_BASE64   base64 of the upload .jks
#   UPLOAD_KEYSTORE_PASSWORD
#   UPLOAD_KEY_ALIAS
#   UPLOAD_KEY_PASSWORD
# Use a GitHub "environment" with required reviewers for extra protection.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - name: Check version tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version: ${tag}+" pubspec.yaml || { echo "tag $tag != pubspec version"; exit 1; }
      - name: Write signing config (runner temp only)
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "signing secrets missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build signed App Bundle (prod)
        run: flutter build appbundle --release --flavor prod
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: safeguard-${{ github.ref_name }}-aab
          path: build/app/outputs/bundle/prodRelease/*.aab
          retention-days: 30
